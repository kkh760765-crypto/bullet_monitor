name: 子弹价格监控

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 缓存 Playwright 浏览器
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: 安装 Playwright 浏览器及系统依赖
        run: |
          playwright install --with-deps chromium

      - name: 恢复上次运行状态
        id: cache-state
        uses: actions/cache@v4
        with:
          path: state.json
          key: bullet-state-${{ github.run_id }}
          restore-keys: |
            bullet-state-

      - name: 执行价格监控
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python monitor.py

      - name: 显示状态
        if: always()
        run: cat state.json 2>/dev/null || echo "无状态文件"
